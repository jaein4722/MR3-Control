name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Validate release version
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python packaging/prepare_version.py --tag $env:GITHUB_REF_NAME
          } else {
            python packaging/prepare_version.py
          }
          if ($LASTEXITCODE -ne 0) { throw 'Version validation failed' }
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: |
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe -m pip install -r packaging/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Run headless tests (no Bluetooth or visible windows)
        run: |
          .\.build-venv\Scripts\python.exe -m unittest discover -s tests -t .
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Prepare pinned portable Inno Setup
        run: ./packaging/setup-inno.ps1
      - name: Build and validate installer
        run: ./packaging/build.ps1
      - name: Save installer and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: |
            release/MR3-Control-${{ steps.version.outputs.version }}-Setup-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.exe SHA256SUMS.txt \
            --verify-tag --title "MR3 Control $RELEASE_TAG" --generate-notes
